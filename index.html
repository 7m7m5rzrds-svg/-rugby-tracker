<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101814"><link rel="manifest" href="manifest.json"><title>Rugby Stats</title><style>
:root{--bg:#0d1411;--card:#17211c;--muted:#9dad9f;--line:#2a3930;--text:#f5f7f5;--accent:#d9ff54;--danger:#ff796f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:650px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}h1{font-size:29px;margin:2px 0 5px}h2{font-size:17px;margin:20px 0 10px;color:#dce4de}.sub{color:var(--muted);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.players,.actions,.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.players button,.primary,.secondary,.stat{border:0;border-radius:15px;font-weight:750}.players button{padding:17px;background:#223027;color:white;font-size:18px}.players button.active{background:var(--accent);color:#111}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#101814;color:white;font-size:16px}.primary{width:100%;padding:16px;background:var(--accent);color:#111;font-size:17px;margin-top:12px}.secondary{padding:14px;background:#25332b;color:white;font-size:15px}.danger{background:#472321}.actions{grid-template-columns:1fr 1fr}.stat{min-height:84px;padding:10px;background:#1d2a23;color:white;font-size:15px;border:1px solid #304239;touch-action:manipulation}.stat:active{transform:scale(.97);background:#2b3c32}.stat b{display:block;font-size:27px;color:var(--accent);margin-top:4px}.headerrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:13px;color:var(--accent);background:#202e26;border-radius:20px;padding:7px 10px}.hidden{display:none!important}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum{background:#111a16;padding:11px;border-radius:11px}.sum span{display:block;color:var(--muted);font-size:12px}.sum strong{font-size:20px}.match{padding:12px 0;border-bottom:1px solid var(--line)}.match:last-child{border:0}.match small{color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tabs button{padding:11px;border-radius:11px;border:1px solid var(--line);background:transparent;color:white;font-weight:700}.tabs button.active{background:#25332b}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
</style></head><body><main>
<section id="setup"><h1>🏉 Rugby Stats</h1><p class="sub">Fast sideline tracking for James & Jack.</p><div class="card"><h2 style="margin-top:0">Who are you tracking?</h2><div class="players"><button data-player="James">James</button><button data-player="Jack">Jack</button></div><h2>Match</h2><div class="inputs"><input id="opposition" placeholder="Opposition"><input id="date" type="date"></div><button class="primary" id="start">Start match</button></div><div class="tabs"><button id="historyTab" class="active">History</button><button id="seasonTab">Season totals</button></div><div id="history" class="card"></div><div id="season" class="card hidden"></div><p class="note">Stats are stored on this device. No account required.</p></section>
<section id="game" class="hidden"><div class="headerrow"><div><h1 id="gameTitle">James</h1><p class="sub" id="gameMeta"></p></div><div class="pill" id="totalEvents">0 events</div></div><h2>🏉 ATTACK</h2><div id="attack" class="actions"></div><h2>🛡️ DEFENCE</h2><div id="defence" class="actions"></div><div class="bottom" style="margin-top:18px"><button class="secondary" id="undo">↩ Undo</button><button class="secondary danger" id="finish">🏁 Finish match</button></div></section>
<section id="result" class="hidden"><h1>Match saved ✓</h1><p class="sub" id="resultMeta"></p><div id="resultStats" class="card summary"></div><button class="primary" id="done">Back to tracker</button></section>
<script>
const STAT_CONFIG={attack:['Carry','Pass','Handoff','Defender Beaten','Offload','Line Break','Try','Turnover Lost'],defence:['Tackle','Missed Tackle','Jackal','Turnover Won','Interception','Penalty Won']};
let player=null,current=null,lastActions=[]; const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
$('#date').value=new Date().toISOString().slice(0,10);
$$('[data-player]').forEach(b=>b.onclick=()=>{$$('[data-player]').forEach(x=>x.classList.remove('active'));b.classList.add('active');player=b.dataset.player});
function blankStats(){let o={};[...STAT_CONFIG.attack,...STAT_CONFIG.defence].forEach(x=>o[x]=0);return o}
function renderButtons(){['attack','defence'].forEach(type=>{const box=$('#'+type);box.innerHTML='';STAT_CONFIG[type].forEach(name=>{let b=document.createElement('button');b.className='stat';b.innerHTML=`${name}<b>0</b>`;b.dataset.stat=name;b.onclick=()=>add(name);box.appendChild(b)})})}
function add(name){current.stats[name]++;lastActions.push(name);updateGame()}
function updateGame(){$$('.stat').forEach(b=>b.querySelector('b').textContent=current.stats[b.dataset.stat]);let n=Object.values(current.stats).reduce((a,b)=>a+b,0);$('#totalEvents').textContent=n+' event'+(n===1?'':'s')}
$('#start').onclick=()=>{if(!player){alert('Choose James or Jack first.');return}current={player,opposition:$('#opposition').value.trim()||'Opposition not entered',date:$('#date').value,stats:blankStats()};lastActions=[];renderButtons();updateGame();$('#gameTitle').textContent=player;$('#gameMeta').textContent=`vs ${current.opposition} • ${formatDate(current.date)}`;show('game')};
$('#undo').onclick=()=>{let n=lastActions.pop();if(n&&current.stats[n]>0){current.stats[n]--;updateGame()}};
$('#finish').onclick=()=>{if(!confirm('Finish and save this match?'))return;let matches=load();matches.unshift(current);localStorage.setItem('rugbyMatches',JSON.stringify(matches));$('#resultMeta').textContent=`${current.player} vs ${current.opposition} • ${formatDate(current.date)}`;$('#resultStats').innerHTML=Object.entries(current.stats).filter(([,v])=>v>0).map(([k,v])=>`<div class="sum"><span>${k}</span><strong>${v}</strong></div>`).join('')||'<p>No events recorded.</p>';show('result');renderHome()};
$('#done').onclick=()=>show('setup');function show(id){['setup','game','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function load(){try{return JSON.parse(localStorage.getItem('rugbyMatches'))||[]}catch{return[]}}
function formatDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function renderHome(){let m=load();$('#history').innerHTML=m.length?m.slice(0,12).map(x=>`<div class="match"><strong>${x.player} vs ${escapeHtml(x.opposition)}</strong><br><small>${formatDate(x.date)} • ${Object.values(x.stats).reduce((a,b)=>a+b,0)} recorded events</small></div>`).join(''):'<span class="sub">No matches recorded yet.</span>';let html='';['James','Jack'].forEach(p=>{let pm=m.filter(x=>x.player===p),tot=blankStats();pm.forEach(x=>Object.keys(tot).forEach(k=>tot[k]+=x.stats[k]||0));html+=`<h2>${p} <small style="color:var(--muted)">(${pm.length} matches)</small></h2><div class="summary">`+Object.entries(tot).filter(([,v])=>v>0).map(([k,v])=>`<div class="sum"><span>${k}</span><strong>${v}</strong></div>`).join('')+'</div>'});$('#season').innerHTML=html||'No stats yet.'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('#historyTab').onclick=()=>{$('#history').classList.remove('hidden');$('#season').classList.add('hidden');$('#historyTab').classList.add('active');$('#seasonTab').classList.remove('active')};$('#seasonTab').onclick=()=>{$('#season').classList.remove('hidden');$('#history').classList.add('hidden');$('#seasonTab').classList.add('active');$('#historyTab').classList.remove('active')};
renderHome(); if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></main></body></html>
