<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101814"><link rel="manifest" href="./manifest.json"><title>Rugby Stats</title><style>
:root{--bg:#0d1411;--card:#17211c;--muted:#9dad9f;--line:#2a3930;--text:#f5f7f5;--accent:#d9ff54;--pos:#2f6d49;--pos2:#3f8b60;--neg:#7a3532;--neg2:#a74740}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:650px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}h1{font-size:29px;margin:2px 0 5px}h2{font-size:17px;margin:20px 0 10px;color:#dce4de}.sub{color:var(--muted);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.players,.actions,.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}.players button,.primary,.secondary,.stat{border:0;border-radius:15px;font-weight:750}.players button{padding:17px;background:#223027;color:white;font-size:18px}.players button.active{background:var(--accent);color:#111}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#101814;color:white;font-size:16px}.primary{width:100%;padding:16px;background:var(--accent);color:#111;font-size:17px;margin-top:12px}.secondary{padding:14px;background:#25332b;color:white;font-size:15px}.danger{background:#472321}.stat{min-height:82px;padding:10px;color:white;font-size:15px;border:1px solid #41604d;touch-action:manipulation}.stat.pos{background:var(--pos)}.stat.neg{background:var(--neg);border-color:#8c4a45}.stat:active{transform:scale(.97);filter:brightness(1.18)}.stat b{display:block;font-size:25px;margin-top:4px}.stat small{display:block;opacity:.85;margin-top:3px}.headerrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:13px;color:var(--accent);background:#202e26;border-radius:20px;padding:7px 10px;text-align:right}.hidden{display:none!important}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum{background:#111a16;padding:11px;border-radius:11px}.sum span{display:block;color:var(--muted);font-size:12px}.sum strong{font-size:20px}.sum.positive strong{color:#8fe0aa}.sum.negative strong{color:#ffaaa2}.match{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.match:last-child{border:0}.match small{color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tabs button{padding:11px;border-radius:11px;border:1px solid var(--line);background:transparent;color:white;font-weight:700}.tabs button.active{background:#25332b}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.back{border:0;background:transparent;color:var(--accent);font-size:16px;padding:4px 0 10px}.delete{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:1px solid #6b3732;background:#351c19;color:#ffaaa2;font-weight:700}.chart{display:flex;align-items:flex-end;gap:7px;height:150px;margin-top:18px;padding-top:10px;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:0;background:var(--accent);border-radius:6px 6px 0 0;position:relative}.bar em{position:absolute;top:-22px;width:100%;text-align:center;font-style:normal;font-size:12px}.labels{display:flex;gap:7px}.labels span{flex:1;text-align:center;color:var(--muted);font-size:10px;padding-top:6px;overflow:hidden}.metric{font-size:30px;font-weight:800}.guideBtn{border:1px solid var(--line);background:#202e26;color:white;border-radius:50%;width:34px;height:34px;font-weight:800;font-size:17px}.sectionTitle{display:flex;align-items:center;justify-content:space-between}.ratingRow{margin:14px 0}.ratingRow label{display:flex;justify-content:space-between;margin-bottom:7px}.ratingRow input{padding:0}.scoreHero{text-align:center;padding:18px}.scoreHero strong{font-size:40px;color:var(--accent)}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tools button{padding:11px;border-radius:11px;border:1px solid var(--line);background:#202e26;color:white;font-weight:700}
</style></head><body><main>
<section id="setup"><h1>🏉 Rugby Stats</h1><p class="sub">Fast sideline tracking for James & Jack.</p><div class="card"><h2 style="margin-top:0">Who are you tracking?</h2><div class="players"><button data-player="James">James</button><button data-player="Jack">Jack</button></div><h2>Match</h2><div class="inputs"><input id="opposition" placeholder="Opposition"><input id="date" type="date"><select id="position"><option value="">Position</option><option>1 Loosehead Prop</option><option>2 Hooker</option><option>3 Tighthead Prop</option><option>4 Lock</option><option>5 Lock</option><option>6 Blindside Flanker</option><option>7 Openside Flanker</option><option>8 Number 8</option><option>9 Scrum Half</option><option>10 Fly Half</option><option>11 Left Wing</option><option>12 Inside Centre</option><option>13 Outside Centre</option><option>14 Right Wing</option><option>15 Fullback</option></select></div><button class="primary" id="start">Start match</button></div><div class="tabs"><button id="historyTab" class="active">History</button><button id="seasonTab">Season</button><button id="progressTab">Progress</button></div><div id="history" class="card"></div><div id="season" class="card hidden"></div><div id="progress" class="card hidden"></div><div class="tools"><button id="exportBtn">Export backup</button><button id="importBtn">Restore backup</button><input id="importFile" class="hidden" type="file" accept="application/json"></div><p class="note">Stats are stored on this device. No account required.</p></section>
<section id="game" class="hidden"><div class="headerrow"><div><h1 id="gameTitle">James</h1><p class="sub" id="gameMeta"></p></div><div class="pill"><div id="livePoints">0 pts</div><div id="totalEvents">0 events</div></div></div><div class="sectionTitle"><h2>🏉 ATTACK</h2><button class="guideBtn" data-guide="attack">ⓘ</button></div><div id="attack" class="actions"></div><div class="sectionTitle"><h2>🛡️ DEFENCE</h2><button class="guideBtn" data-guide="defence">ⓘ</button></div><div id="defence" class="actions"></div><div class="bottom" style="margin-top:18px"><button class="secondary" id="undo">↩ Undo</button><button class="secondary danger" id="finish">🏁 Finish match</button></div></section>
<section id="review" class="hidden"><button class="back" id="reviewBack">← Back to match</button><h1>Finish match</h1><p class="sub">Add the context and your five ratings.</p><div class="card"><div class="inputs"><input id="minutes" type="number" min="0" placeholder="Minutes played"><input id="teamScore" type="number" min="0" placeholder="Our score"><input id="oppScore" type="number" min="0" placeholder="Opposition score"></div><div id="ratings"></div><button class="primary" id="saveMatch">Save match</button></div></section>
<section id="guide" class="hidden"><button class="back" id="guideBack">← Back to match</button><h1 id="guideTitle">Stats guide</h1><div id="guideBody" class="card"></div></section>
<section id="detail" class="hidden"><button class="back" id="detailBack">← Back to history</button><h1 id="detailTitle">Match</h1><p class="sub" id="detailMeta"></p><div id="detailScore"></div><div id="detailStats" class="card summary"></div><div id="detailRatings"></div><button class="delete" id="deleteMatch">Delete this match</button></section>
<section id="result" class="hidden"><h1>Match saved ✓</h1><p class="sub" id="resultMeta"></p><div id="resultScore"></div><div id="resultStats" class="card summary"></div><button class="primary" id="done">Back to tracker</button></section>
<script>
const CONFIG={attack:[
{name:'Key Pass',pts:2,desc:'A pass that creates a meaningful attacking opportunity.'},{name:'Defender Beaten',pts:2,desc:'Clearly gets beyond a defender with ball in hand through pace, power, sidestep, handoff or change of direction. Tap once per defender beaten.'},{name:'Handoff',pts:1,desc:'Successful use of a handoff. Also tap Defender Beaten if the handoff beats the defender.'},{name:'Line Break',pts:3,desc:'Breaks through the defensive line with ball in hand.'},{name:'Offload',pts:2,desc:'Successful offload in or after contact that keeps possession alive.'},{name:'Ruck Secured',pts:2,desc:'First/effective supporting player into an attacking breakdown who actively helps secure our possession.'},{name:'Try Assist',pts:4,desc:'Final meaningful action or pass that directly creates a try.'},{name:'Try',pts:5,desc:'Scores a try.'},{name:'Possession Lost',pts:-3,desc:'Player error loses possession: knock-on, dropped ball, stripped ball, poor pass/offload or similar.'}],
defence:[
{name:'Tackle',pts:2,desc:'Successful tackle that stops or meaningfully slows the ball carrier.'},{name:'Missed Tackle',pts:-5,desc:'Genuine tackle opportunity where the attacker gets past.'},{name:'Dominant Tackle',pts:3,desc:'Wins the collision and stops/drives the attacker. Also record Tackle.'},{name:'Try-Saving Tackle',pts:5,desc:'Tackle that directly prevents a probable try. Also record Tackle.'},{name:'Jackal Attempt',pts:2,desc:'Gets into a legal jackal position and makes a genuine attempt to win the ball.'},{name:'Jackal Won',pts:5,desc:'Successfully wins the contest through a jackal.'},{name:'Turnover Won',pts:5,desc:'Personally wins possession by another turnover method such as rip, strip or steal.'},{name:'Forced Error',pts:3,desc:'Defensive pressure directly causes an opposition error.'},{name:'Interception',pts:4,desc:'Reads play and intercepts opposition possession.'},{name:'Penalty Won',pts:5,desc:'Player action directly wins a penalty. Can be recorded with Jackal Won when both occur.'},{name:'Penalty Conceded',pts:-5,desc:'Player personally concedes a penalty.'}]};
const RATING_NAMES=['Overall','Communication / Leadership','Posture / Presence','Aggression','Decision Making'];
const ALL=[...CONFIG.attack,...CONFIG.defence], OLD=['Carry','Pass','Side Step','Turnover Lost','Jackal'];
let player=null,current=null,lastActions=[],detailIndex=null,lastScreen='game';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
$('#date').value=new Date().toISOString().slice(0,10);$$('[data-player]').forEach(b=>b.onclick=()=>{$$('[data-player]').forEach(x=>x.classList.remove('active'));b.classList.add('active');player=b.dataset.player});
function blankStats(){let o={};[...ALL.map(x=>x.name),...OLD].forEach(x=>o[x]=0);return o}function cfg(n){return ALL.find(x=>x.name===n)}
function renderButtons(){['attack','defence'].forEach(type=>{let box=$('#'+type);box.innerHTML='';CONFIG[type].forEach(s=>{let b=document.createElement('button');b.className='stat '+(s.pts<0?'neg':'pos');b.innerHTML=`${s.name}<b>0</b><small>${s.pts>0?'+':''}${s.pts} pts</small>`;b.dataset.stat=s.name;b.onclick=()=>add(s.name);box.appendChild(b)})})}
function pointsFor(stats){let pos=0,neg=0;ALL.forEach(s=>{let p=(stats[s.name]||0)*s.pts;if(p>=0)pos+=p;else neg+=p});return{pos,neg,total:pos+neg}}
function add(name){current.stats[name]=(current.stats[name]||0)+1;lastActions.push(name);updateGame()}function updateGame(){$$('.stat').forEach(b=>b.querySelector('b').textContent=current.stats[b.dataset.stat]||0);let n=ALL.reduce((a,s)=>a+(current.stats[s.name]||0),0),p=pointsFor(current.stats);$('#totalEvents').textContent=n+' event'+(n===1?'':'s');$('#livePoints').textContent=(p.total>=0?'+':'')+p.total+' pts'}
$('#start').onclick=()=>{if(!player){alert('Choose James or Jack first.');return}current={version:3,player,opposition:$('#opposition').value.trim()||'Opposition not entered',date:$('#date').value,position:$('#position').value,stats:blankStats()};lastActions=[];renderButtons();updateGame();$('#gameTitle').textContent=player;$('#gameMeta').textContent=`vs ${current.opposition} • ${formatDate(current.date)}${current.position?' • '+current.position:''}`;show('game')};
$('#undo').onclick=()=>{let n=lastActions.pop();if(n&&current.stats[n]>0){current.stats[n]--;updateGame()}};$('#finish').onclick=()=>{renderRatings();show('review')};$('#reviewBack').onclick=()=>show('game');
function renderRatings(){let old=current.ratings||{};$('#ratings').innerHTML='<h2>Your ratings • 1–10</h2>'+RATING_NAMES.map(n=>`<div class="ratingRow"><label><span>${n}</span><strong id="v-${safe(n)}">${old[n]||5}</strong></label><input type="range" min="1" max="10" value="${old[n]||5}" data-rating="${n}"></div>`).join('');$$('[data-rating]').forEach(r=>r.oninput=()=>$('#v-'+safe(r.dataset.rating)).textContent=r.value)}
$('#saveMatch').onclick=()=>{current.minutes=numOrNull($('#minutes').value);current.teamScore=numOrNull($('#teamScore').value);current.oppScore=numOrNull($('#oppScore').value);current.ratings={};$$('[data-rating]').forEach(r=>current.ratings[r.dataset.rating]=+r.value);let matches=load();matches.unshift(current);save(matches);renderResult(current);renderHome();show('result')};
function renderResult(x){$('#resultMeta').textContent=meta(x);$('#resultScore').innerHTML=scoreCard(x);$('#resultStats').innerHTML=statCards(x.stats,true)};$('#done').onclick=()=>show('setup');
function show(id){['setup','game','review','guide','detail','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function load(){try{return JSON.parse(localStorage.getItem('rugbyMatches'))||[]}catch{return[]}}function save(m){localStorage.setItem('rugbyMatches',JSON.stringify(m))}
function normaliseMatch(x){let stats=blankStats();Object.keys(x.stats||{}).forEach(k=>stats[k]=x.stats[k]||0);return{...x,stats,ratings:x.ratings||{}}}function formatDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}function meta(x){let a=[formatDate(x.date),x.position,x.minutes!=null?x.minutes+' mins':null];if(x.teamScore!=null&&x.oppScore!=null)a.push(`${x.teamScore}–${x.oppScore}`);return a.filter(Boolean).join(' • ')}
function scoreCard(x){let p=pointsFor(x.stats);return `<div class="card"><div class="summary"><div class="sum positive"><span>Positive points</span><strong>+${p.pos}</strong></div><div class="sum negative"><span>Negative points</span><strong>${p.neg}</strong></div><div class="sum"><span>Performance points</span><strong>${p.total>=0?'+':''}${p.total}</strong></div><div class="sum"><span>Positive : negative</span><strong>${p.neg?Math.abs(p.pos/p.neg).toFixed(1)+':1':'—'}</strong></div></div></div>`}
function statCards(stats,onlyUsed=false){let entries=ALL.map(s=>[s.name,stats[s.name]||0]);if(onlyUsed)entries=entries.filter(([,v])=>v>0);return entries.map(([k,v])=>`<div class="sum"><span>${k}</span><strong>${v}</strong></div>`).join('')||'<p>No events recorded.</p>'}
function renderHome(){let m=load().map(normaliseMatch);$('#history').innerHTML=m.length?m.slice(0,50).map((x,i)=>{let p=pointsFor(x.stats);return `<div class="match" data-match="${i}"><strong>${x.player} vs ${esc(x.opposition)}</strong><br><small>${meta(x)} • ${p.total>=0?'+':''}${p.total} pts ›</small></div>`}).join(''):'<span class="sub">No matches recorded yet.</span>';$$('[data-match]').forEach(el=>el.onclick=()=>openMatch(+el.dataset.match));let html='';['James','Jack'].forEach(p=>{let pm=m.filter(x=>x.player===p),pos=0,neg=0;pm.forEach(x=>{let q=pointsFor(x.stats);pos+=q.pos;neg+=q.neg});html+=`<h2>${p} <small style="color:var(--muted)">(${pm.length} matches)</small></h2>`+(pm.length?`<div class="summary"><div class="sum positive"><span>Positive points</span><strong>+${pos}</strong></div><div class="sum negative"><span>Negative points</span><strong>${neg}</strong></div><div class="sum"><span>Performance points</span><strong>${pos+neg>=0?'+':''}${pos+neg}</strong></div><div class="sum"><span>Avg / match</span><strong>${Math.round((pos+neg)/pm.length)}</strong></div></div>`:'<p class="sub">No matches yet.</p>')});$('#season').innerHTML=html;renderProgress(m)}
function openMatch(i){let m=load().map(normaliseMatch),x=m[i];if(!x)return;detailIndex=i;$('#detailTitle').textContent=`${x.player} vs ${x.opposition}`;$('#detailMeta').textContent=meta(x);$('#detailScore').innerHTML=scoreCard(x);$('#detailStats').innerHTML=statCards(x.stats,false);$('#detailRatings').innerHTML=Object.keys(x.ratings||{}).length?`<h2>Your ratings</h2><div class="card summary">${RATING_NAMES.map(n=>`<div class="sum"><span>${n}</span><strong>${x.ratings[n]||'—'}</strong></div>`).join('')}</div>`:'';show('detail')}
$('#detailBack').onclick=()=>show('setup');$('#deleteMatch').onclick=()=>{if(detailIndex===null||!confirm('Delete this match permanently?'))return;let m=load();m.splice(detailIndex,1);save(m);detailIndex=null;renderHome();show('setup')};
function renderProgress(m){let options=['Performance Points','Positive Points','Negative Points',...ALL.map(x=>x.name),...RATING_NAMES];$('#progress').innerHTML=`<div class="players"><button data-progplayer="James" class="active">James</button><button data-progplayer="Jack">Jack</button></div><h2>Track progress</h2><select id="progressStat">${options.map(s=>`<option>${s}</option>`).join('')}</select><div id="progressChart"></div>`;let pp='James';$$('[data-progplayer]').forEach(b=>b.onclick=()=>{pp=b.dataset.progplayer;$$('[data-progplayer]').forEach(x=>x.classList.toggle('active',x===b));drawProgress(m,pp,$('#progressStat').value)});$('#progressStat').onchange=()=>drawProgress(m,pp,$('#progressStat').value);drawProgress(m,pp,$('#progressStat').value)}
function drawProgress(m,p,stat){let pm=m.filter(x=>x.player===p).slice().reverse(),vals=pm.map(x=>{let q=pointsFor(x.stats);if(stat==='Performance Points')return q.total;if(stat==='Positive Points')return q.pos;if(stat==='Negative Points')return Math.abs(q.neg);if(RATING_NAMES.includes(stat))return x.ratings?.[stat]||0;return x.stats[stat]||0});if(!pm.length){$('#progressChart').innerHTML='<p class="sub">No matches yet.</p>';return}let max=Math.max(...vals.map(Math.abs),1),latest=vals.at(-1);$('#progressChart').innerHTML=`<h2>${stat}</h2><div class="metric">${latest}</div><div class="chart">${vals.map(v=>`<div class="bar" style="height:${Math.max(3,Math.abs(v)/max*100)}%"><em>${v}</em></div>`).join('')}</div><div class="labels">${pm.map(x=>`<span>${formatDate(x.date).replace(/ 202\d/,'')}</span>`).join('')}</div><p class="note">Oldest to newest.</p>`}
$$('[data-guide]').forEach(b=>b.onclick=()=>{lastScreen='game';let type=b.dataset.guide;$('#guideTitle').textContent=(type==='attack'?'🏉 Attack':'🛡️ Defence')+' guide';$('#guideBody').innerHTML=CONFIG[type].map(s=>`<div class="match"><strong>${s.name} ${s.pts>0?'+':''}${s.pts}</strong><br><small>${s.desc}</small></div>`).join('');show('guide')});$('#guideBack').onclick=()=>show(lastScreen);
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Rugby Stats',version:3,exported:new Date().toISOString(),matches:load()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rugby-stats-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),m=Array.isArray(d)?d:d.matches;if(!Array.isArray(m))throw 0;if(confirm(`Restore ${m.length} matches from this backup? This will replace the matches currently on this device.`)){save(m);renderHome();alert('Backup restored.')}}catch{alert('That does not look like a valid Rugby Stats backup.')}};r.readAsText(f)};
function numOrNull(v){return v===''?null:+v}function safe(s){return s.replace(/[^a-z0-9]/gi,'')}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function tab(id){['history','season','progress'].forEach(x=>{$('#'+x).classList.toggle('hidden',x!==id);$('#'+x+'Tab').classList.toggle('active',x===id)})}$('#historyTab').onclick=()=>tab('history');$('#seasonTab').onclick=()=>tab('season');$('#progressTab').onclick=()=>tab('progress');renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></main></body></html>
